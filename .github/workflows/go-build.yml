name: go-build
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trishula-go-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build all commands
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # -p 1: serialized package order. The bench cells read their walls
      # without sibling-package CPU load on the runner.
      # coraza.rule.no_regex_multiline: the CRS-aligned @rx profile
      # (multiline off by default; upstream flips this default in v4).
      - name: Test
        run: go test -tags coraza.rule.no_regex_multiline -p 1 ./...
      # -v prints the per-row MEASURED/M2 CELL wall lines the README ledger
      # cites. Without -v the bench runs green but records no walls; the
      # ledger re-read at each release reads THIS step's rows.
      - name: Bench walls (verbose)
        run: go test -tags coraza.rule.no_regex_multiline -p 1 -run TestBudgetVerdictsOnLivePath -v ./test/bench/
