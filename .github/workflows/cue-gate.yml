# TR-46 (issue #192) — the CUE declarative gate for the structured
# artefacts of the tree.
#
# cue vet validates the CUE definitions (each data instance against the
# schemas it carries, concrete) and the committed CRD against the cue/crd
# validation layer (the CRD stays controller-gen-owned; api/v1alpha1's
# determinism test keeps pinning its bytes). The golden-diff step then
# regenerates every derived artefact through the CUE Go API
# (internal/cuegen via cmd/cuegen) and fails on any diff: a hand edit to a
# derived artefact fails the gate, and a stale derivation fails it too.
#
# Kernel-free: the job is pure Go plus the cue CLI — no eBPF, no cluster.
name: cue-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trishula-cue-gate
  cancel-in-progress: false

jobs:
  cue-gate:
    name: "cue vet + golden diff"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The cue CLI is installed from the exact cuelang.org/go version go.mod
      # pins (v0.17.1), so the gate and the definitions read the same
      # language version. Bump this line together with go.mod.
      - name: Install cue (pinned to the go.mod version)
        run: go install cuelang.org/go/cmd/cue@v0.17.1 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: vet (packages + CRD validation layer)
        run: |
          cue vet -c ./cue/...
          cue vet manifests/crd/wafpolicy-crd.yaml ./cue/crd -d '#WAFPolicyCRD'
      - name: Regeneration + golden diff
        run: |
          go run ./cmd/cuegen
          cue fmt ./cue/...
          git diff --exit-code
          test -z "$(git status --porcelain)" && echo "golden diff clean: no derived artefact drifted"
