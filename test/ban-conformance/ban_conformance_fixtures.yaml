          kind: crsCritical
      - at: 15
        ingest:
          key: 203.0.113.50
          kind: crsWarning
      - at: 20
        ingest:
          key: 203.0.113.50
          kind: botSingle
      - at: 20
        evaluate:
          key: 203.0.113.50
          state: CLEAR
          wantWouldBan: false
      - at: 21
        evaluate:
          key: 203.0.113.50
          state: CLEAR
          wantWouldBan: false
          strictDecay: true
    evidenceChecks: []
  - id: F02
    name: same instants as F01, bot-consensus-dominant mix scores differently
