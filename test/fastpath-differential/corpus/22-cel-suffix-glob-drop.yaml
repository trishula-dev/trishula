name: 22-cel-suffix-glob-drop
surface: a leading-star path glob compiles to the suffix leg; the frame carries the suffix at the target end
skipped: false
policy:
  defaultAction: pass
  rules:
  - id: DX-LAB-003
    action: enforce
    expression: |
      request.method == "POST" &&
      path.matches("/*-admin")
frame:
  ethertype: ipv4
  tcpDoff: 5
  line: POST /v1/-admin?q=1 HTTP/1.1
  pad: 0
view:
  method: POST
  path: /v1/-admin
  query: q=1
  rate5m: 0
classes:
- drop-row
- cel-glob-row
expect:
  outcome: drop
  marked: true
  rowid: 0
