name: 11-seed-log-matches
surface: the seed CEL rule resolves log on the same frame the route row forwards
skipped: false
policy:
  defaultAction: pass
  routes:
  - prefix: /v1/chat
    action: forward
  - prefix: /v1/admin
    action: drop
frame:
  ethertype: ipv4
  tcpDoff: 5
  line: POST /v1/chat/completions HTTP/1.1
  pad: 0
view:
  method: POST
  path: /v1/chat/completions
  query: ''
  rate5m: 41
classes:
- forward-row
expect:
  outcome: forward
  marked: true
  rowid: 0
