name: 09-nul-shorten-matches-prefix
surface: a NUL inside the path shortens the key; the visible prefix still matches
skipped: false
policy:
  defaultAction: pass
  routes:
  - prefix: /v1/chat
    action: forward
  - prefix: /v1/admin
    action: drop
frame:
  ethertype: ipv4
  tcpDoff: 5
  line: "GET /v1/chat\0extra HTTP/1.1"
  pad: 0
view:
  method: GET
  path: /v1/chat
  query: ''
  rate5m: 0
classes:
- nul-shape
- forward-row
expect:
  outcome: forward
  marked: true
  rowid: 0
