name: 23-cel-query-miss-forward
surface: 'the query-substring leg rides the engine tier (the envelope gate: the query pass composites with any second pass); the rule routes T2 and the frame forwards unmarked'
skipped: false
policy:
  defaultAction: pass
  rules:
  - id: DX-LAB-001
    action: enforce
    expression: |
      request.method == "POST" &&
      path.matches("/v1/chat/*") &&
      request.query.contains("UNION")
frame:
  ethertype: ipv4
  tcpDoff: 5
  line: POST /v1/chat/items?q=NOOP HTTP/1.1
  pad: 0
view:
  method: POST
  path: /v1/chat/items
  query: q=NOOP
  rate5m: 0
classes:
- cel-t2-route
- cel-query-row
expect:
  outcome: forward
  marked: false
