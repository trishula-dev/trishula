fixture_images:
  # The four suite images (engine, operator, vuln-app, benign-app) build
  # from the suite checkout. The deploy contract names the tag checkout,
  # never a PR sha. They push to GHCR under a per-run tag.
  # The cluster pulls those bytes.
  recipe: fixtures/waf-harness/Dockerfile
  registry: ghcr.io/trishula-dev
  tag_scheme: "wafrs-<run_id>-<run_attempt>"
  per_run: true
