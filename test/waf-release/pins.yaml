  wheel_file: sqlmap-1.10.11-py2.py3-none-any.whl
  wheel_sha256: 223a0dda06eadb8eb8a06d2e9ef90281919fdc2203d9cf5979da3311d6af440a
  gh_tag_tarball_sha256: 4eb31c50d9b375361754de95e496a1abdc07c25d520e0c0a36f69e8f516e6e97
  install: pip-install-require-hashes

open_appsec:
