# TR-07b — the seeded CRS engine surface (SecLang).
#
# The rule surface BOTH the engine-mirror stage (internal mirror of the
# latched S2 slot) and the Coraza reference evaluator load. Composition:
#   engine.conf (this file: engine shell + exclusion rules 990001..990004)
#   + crs-setup.conf.example        (CRS 4.0.0-rc2 setup template, defaults)
#   + @owasp_crs/REQUEST-901-INITIALIZATION.conf (auto-included by every 9xx)
#   + the five CRS attack-file includes listed below.
# All CRS content is embedded verbatim from the crs engine rulepack — the
# corpus stays hermetic (no network at test time).
#
# Engine posture (PL1-equivalent):
#   - threshold/PL defaults come from crs-setup + the 901 initialization
#     (&TX guards set 5/4 thresholds, PL1 blocking+detection);
#   - a minimal, versioned exclusion surface (SecRule*RemoveById rules, the
#     versioned exclusion analog of the §16.5 CRD surface) demotes the two
#     CRS rules whose PL1 semantics are FINGERPRINT/probe-shaped rather than
#     attack-shaped, because the engine mirror pins attack-rule parity:
#       941010  REQUEST_FILENAME byte-range gate (drops every real URI —
#               a PL1 XSS gate on the raw filename alphabet);
#       921170  ARGS_NAMES param-counter (PL3 helper; fires on every
#               ?k=v URI and re-fires after its own phase-2 remove, so it
#               is demoted in both phases).
#     The demotions are pinned per-REQUEST_FILENAME/PL so plain "/" requests
#     keep the full CRS surface; both ids stay in the corpus delta table
#     (README).
#   - 900990 (crs-setup setup-echo) is deliberately UNTOUCHED: every request
#     phase-1-carries it (the engine mirror drops phase-3 echoes), pinned in
#     the README delta table.
#
# ids 990001..990004 are TR-07b private (outside CRS ranges; CRS parity
# semantics are pinned by the includes + removes, never by renumbering CRS).

SecRuleEngine On

SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyInMemoryLimit 1048576
SecResponseBodyAccess Off

# -- response-body plumbing (Coraza requires a response processor enabler) --
SecRule TX:ALLOW_RESPONSE_BODY "@eq 0" "id:990001,phase:3,pass,nolog,ctl:requestBodyProcessor=RESPONSE_BODY"

# -- versioned exclusion surface (§16.5 analog; see header) --
SecRule REQUEST_FILENAME "!@rx ^/$" "id:990002,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941010;REQUEST_FILENAME"
SecRule TX:DETECTION_PARANOIA_LEVEL "@ge 1" "id:990003,phase:1,pass,nolog,ctl:ruleRemoveById=921170"
SecRule TX:DETECTION_PARANOIA_LEVEL "@ge 1" "id:990004,phase:2,pass,nolog,ctl:ruleRemoveById=921170"

Include crs-setup.conf.example
Include @owasp_crs/REQUEST-942-APPLICATION-ATTACK-SQLI.conf
Include @owasp_crs/REQUEST-941-APPLICATION-ATTACK-XSS.conf
Include @owasp_crs/REQUEST-930-APPLICATION-ATTACK-LFI.conf
Include @owasp_crs/REQUEST-913-SCANNER-DETECTION.conf
Include @owasp_crs/REQUEST-944-APPLICATION-ATTACK-JAVA.conf
Include @owasp_crs/REQUEST-921-PROTOCOL-ATTACK.conf

# exclusions apply AFTER the includes (parse-time; rules must exist).
# 942100 (libinjection) keeps its ARGS_NAMES + URI-surface targets but loses
# ARGS — its corpus cases carry SQLi in the request LINE (REQUEST_URI/
# REQUEST_FILENAME/REQUEST_PATH targets) so ARGS parity is not exercised:
# the engine mirror does not re-derive the raw-body ARGS collection.
# 921170 loses ARGS_NAMES (the always-fire surface both sides would carry;
# the engine mirror cannot reproduce TX:paramcounter side-state).
SecRuleUpdateTargetById 942100 "!ARGS"
SecRuleUpdateTargetById 921170 "!ARGS_NAMES"
