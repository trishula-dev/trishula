# TR-199 corpus case (conformance row): h1 framing ambiguity — duplicate
# Content-Length field values (RFC 9112 §6.3; the protocol-conformance
# verdict record, verdict table row 2). raw_head carries the exact request
# head: the headers-map shape collapses duplicate field names, so the
# framing classes pin raw wire bytes.
name: 31-framing-dup-cl
surface: "h1 framing ambiguity: duplicate Content-Length values (RFC 9112 section 6.3)"
request:
  method: "GET"
  uri: "/"
  version: "1.1"
  headers:
    Host: "trishula.local"
  raw_head: "GET / HTTP/1.1\r\nHost: trishula.local\r\nContent-Length: 6\r\nContent-Length: 11\r\n\r\n"
expect:
  # The record's reject table: the block verdict resolves at the parse
  # path, pre-CRS, with this parse-layer rule id.
  reject_rule: "http1:framing-dup-cl"
