# TR-199 corpus case (conformance row): h1 framing ambiguity —
# Content-Length + Transfer-Encoding together (RFC 9112 §6.1; the
# protocol-conformance verdict record, verdict table row 2). raw_head
# carries the exact request head: the headers-map shape collapses
# duplicate field names, so the framing classes pin raw wire bytes.
name: 30-framing-cl-te
surface: "h1 framing ambiguity: Content-Length + Transfer-Encoding together (RFC 9112 section 6.1)"
request:
  method: "POST"
  uri: "/login"
  version: "1.1"
  headers:
    Host: "trishula.local"
    Content-Type: "application/x-www-form-urlencoded"
  raw_head: "POST /login HTTP/1.1\r\nHost: trishula.local\r\nContent-Type: application/x-www-form-urlencoded\r\nContent-Length: 10\r\nTransfer-Encoding: chunked\r\n\r\n"
expect:
  # The record's reject table: the block verdict resolves at the parse
  # path, pre-CRS, with this parse-layer rule id.
  reject_rule: "http1:framing-cl-te"
