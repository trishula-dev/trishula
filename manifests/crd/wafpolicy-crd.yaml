---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: wafpolicies.trishula.security
spec:
  group: trishula.security
  names:
    kind: WAFPolicy
    listKind: WAFPolicyList
    plural: wafpolicies
    singular: wafpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.defaultAction
      name: Default Action
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WAFPolicy is the v0 CRD binding rule sets, the default action and the
          mode flags to a route class (the spec's CRD set). The route-selector
          fields (spec.routes) land with TR-40b; further failure semantics arrive
          with later TR-08 slices.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WAFPolicySpec is the desired policy state for a route class.
            properties:
              celBudget:
                description: |-
                  CELBudget is the evaluation cost budget (the spec's CEL DSL plus goal G4) the compile
                  applies to every CEL rule this policy compiles that does not declare
                  its own (the rule pack's per-rule costBudget is the more specific
                  declaration and wins). 0 = unset = the engine's package default.
                format: int64
                minimum: 0
                type: integer
              defaultAction:
                allOf:
                - enum:
                  - block
                  - challenge
                  - log
                  - pass
                - enum:
                  - block
                  - challenge
                  - log
                  - pass
                description: DefaultAction is the verdict applied when no rule set
                  fires.
                type: string
              modeFlags:
                description: ModeFlags select the enforcement planes (inline, shield,
                  shadow).
                properties:
                  inline:
                    description: Inline steers the route class through the engine
                      deep-inspection path.
                    type: boolean
                  shadow:
                    description: Shadow evaluates verdict-only; no enforcement.
                    type: boolean
                  shield:
                    description: |-
                      Shield attaches the route class to the kernel fast path (ban/verdict
                      caches).
                    type: boolean
                type: object
              routes:
                description: |-
                  Routes list the path-prefix classes the compile marks on the kernel
                  path (TR-40b, the census class `route`). Every request path outside
                  the listed prefixes carries the default forward, and every field
                  outside this list routes to the slow path (the compile-split record).
                items:
                  description: |-
                    RouteMark selects one HTTP path-prefix class and the kernel-path action
                    it carries (TR-40b: the route class lands on the surface; everything
                    outside the listed prefixes routes to the slow path).
                  properties:
                    action:
                      allOf:
                      - enum:
                        - forward
                        - drop
                      - enum:
                        - forward
                        - drop
                      description: Action is the kernel-path verdict for the class.
                      type: string
                    prefix:
                      description: |-
                        Prefix is the request path the class matches (byte prefix; printable
                        ASCII; the compile re-gates the bounds the kernel template carries).
                      maxLength: 64
                      minLength: 1
                      pattern: ^[\x20-\x7E]+$
                      type: string
                  required:
                  - action
                  - prefix
                  type: object
                maxItems: 8
                type: array
              ruleSets:
                description: RuleSets lists the rule sets the policy compiles into
                  its bundle.
                items:
                  description: |-
                    RuleSetRef binds one rule set into the policy. The compile resolves the
                    ref against the cluster's RuleSet state (compile→load round trip lands
                    with TR-08b).
                  properties:
                    name:
                      description: Name is the referenced rule set (bundle name in
                        the CR namespace).
                      maxLength: 253
                      minLength: 1
                      type: string
                    source:
                      description: Source declares the rule set's upstream.
                      properties:
                        crsVersion:
                          description: CRSVersion pins the OWASP CRS train the bundle
                            resolves against.
                          maxLength: 32
                          minLength: 1
                          type: string
                        profile:
                          allOf:
                          - enum:
                            - PL1
                            - PL2
                            - PL3
                          - enum:
                            - PL1
                            - PL2
                            - PL3
                          description: Profile is the CRS paranoia level.
                          type: string
                      required:
                      - crsVersion
                      - profile
                      type: object
                  required:
                  - name
                  - source
                  type: object
                maxItems: 16
                type: array
            required:
            - defaultAction
            - modeFlags
            type: object
          status:
            description: |-
              Status is the compile-split surface; the compile-to-load round-trip
              stamps it (TR-40b). No CRD version bump rides this field: the status
              subresource predates it.
            properties:
              conditions:
                description: |-
                  Conditions carry the FastPathCompiled summary condition (Gateway API
                  condition vocabulary). The condition is a summary; it never
                  substitutes for the per-field split.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
