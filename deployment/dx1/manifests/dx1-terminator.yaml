# TR-203 L2 (issue #264, leaf L2): the QUIC-ingress lab topology's
# terminator leg (the record: TR-29, docs/design/h3-ingress-posture.md).
# The terminator terminates the QUIC/H3 client leg (the h3 listener on
# UDP :443 + the TLS listener on TCP :443) and speaks HTTP/1.1 upstream
# to the dx1-engine Service — the record's plan, step 2. NGF itself
# ships no h3 listener row: the terminator leg is the operator's own
# nginx build, the same image the lab's NGF 2.7.2 dataplane runs
# (its nginx carries --with-http_v3_module; measure with `nginx -V`).
# The reads (both record the runs in the leaf receipts):
#   bash lab/dx1/h3-ingress-read.sh   (probe P4 + the h3 hop of P8)
#   go test ./test/dosrunner/ -run TestUDPBanIdentityRows -v  (probe P7, in-VM)
# The TLS material = the dx1-lab-tls fixture Secret in this ns
# (the lab fixture pair setup.sh creates; never a product cert). The
# fixture carries the *.dx1.example.com DNS SANs + the 127.0.0.1 IP
# SAN the host-side dials read. DX1_TLS_LEG=0 leaves the leg unapplied.
#
# Generated by internal/cuegen from cue/lab/dx1 (TR-46, issue #192): hand
# edits fail the golden-diff gate; change the CUE source instead.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dx1-terminator-conf
  namespace: dx1
  labels:
    app.kubernetes.io/name: dx1-h3-terminator
data:
  nginx.conf: |-
    # The QUIC-ingress terminator for the DX1 lab (TR-203 L2).
    # The h3 listener (UDP :443, QUIC) + the TLS listener (TCP :443)
    # proxy upstream over HTTP/1.1 to the engine Service (the
    # record's F2 upstream legs). The h3 hop's evidence = the
    # engine's own X-Trishula-Hop marker; the terminator carries
    # none (one marker source per leg).
    worker_processes  1;
    error_log  /dev/stderr warn;
    pid        /tmp/h3terminator.pid;

    events { worker_connections  256; }

    http {
        include       /etc/nginx/mime.types;
        default_type  text/plain;
        access_log off;
        client_body_temp_path /tmp/ngx_client;
        proxy_temp_path /tmp/ngx_proxy;

        server {
            listen 443 ssl;
            listen 443 quic;
            http2  on;
            server_name *.dx1.example.com;

            ssl_certificate     /etc/terminator/tls/tls.crt;
            ssl_certificate_key /etc/terminator/tls/tls.key;
            quic_retry on;

            add_header Alt-Svc 'h3=":443"; ma=86400' always;

            location / {
                proxy_pass http://dx1-engine.dx1.svc.cluster.local:8080;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dx1-terminator
  namespace: dx1
  labels:
    app.kubernetes.io/name: dx1-h3-terminator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dx1-h3-terminator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dx1-h3-terminator
    spec:
      containers:
        - name: terminator
          image: ghcr.io/nginx/nginx-gateway-fabric/nginx:2.7.2
          imagePullPolicy: IfNotPresent
          command:
            - nginx
            - -g
            - daemon off;
          ports:
            - name: quic
              containerPort: 443
              protocol: UDP
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/terminator/tls
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: dx1-terminator-conf
        - name: tls
          secret:
            secretName: dx1-lab-tls
---
apiVersion: v1
kind: Service
metadata:
  name: dx1-terminator
  namespace: dx1
  labels:
    app.kubernetes.io/name: dx1-h3-terminator
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dx1-h3-terminator
  ports:
    - name: quic
      port: 443
      protocol: UDP
      targetPort: quic
      nodePort: 31440
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
      nodePort: 31441
