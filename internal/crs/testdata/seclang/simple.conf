# TR-07 PR A — minimal SecLang snippet for the load-and-evaluate test.
# Four self-registered rules (id:9000..1003) exercise the verdict shape:
#   9000 = phase-1 body-processor enabler (CRS plumbing: the RAW
#          processor makes REQUEST_BODY addressable for phase-2 rules),
#   1001/1002 = phase-1 log markers (UA marker, script fragment in q),
#   1003      = phase-2 deny on the raw body (the disruption surface).
# PL1 posture note: the crs-setup.conf.example profile (paranoia-level 1)
# arrives with the differential bundle; this snippet is self-contained.

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyInMemoryLimit 1048576

SecRule REQUEST_HEADERS:X-Raw "@contains :" "id:9000,phase:1,pass,ctl:requestBodyProcessor=RAW"

SecDefaultAction "phase:1,log,pass"

SecRule REQUEST_HEADERS:User-Agent "@rx ^trishula-shadow/" \
  "id:1001,phase:1,log,pass,msg:'shadow UA marker'"

SecRule ARGS:q "@rx <script>" \
  "id:1002,phase:1,log,pass,msg:'script fragment in q'"

SecRule REQUEST_BODY "@rx badtoken" \
  "id:1003,phase:2,deny,msg:'body token deny (disruption surface)'"
