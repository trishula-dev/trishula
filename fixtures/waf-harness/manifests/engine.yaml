# TR-205 (issue #289) — the engine: one pod running cmd/engine, the image
# built in-job from the PR checkout (item 2). The engine transparently
# forwards to the SQLi-fixture app (vuln-app; the TR-06 contract hop) and
# serves the stable job-internal endpoint here (item 4): the waf-harness
# Engine Service on ClusterIP port 8080. Later tool stages dial this
# Service; the smoke probe port-forwards the runner localhost to it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-harness-engine
  namespace: waf-harness
  labels:
    app.kubernetes.io/name: trishula-engine
    app.kubernetes.io/instance: waf-harness
    app.kubernetes.io/part-of: trishula-waf-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trishula-engine
      app.kubernetes.io/instance: waf-harness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trishula-engine
        app.kubernetes.io/instance: waf-harness
        app.kubernetes.io/part-of: trishula-waf-harness
    spec:
      containers:
        - name: engine
          image: trishula-wh-engine:pr
          imagePullPolicy: IfNotPresent
          args:
            - --listen
            - :8080
            - --upstream
            - http://vuln-app.waf-harness.svc.cluster.local:8080
            - --hop
            - engine
            - --bundle
            - /bundle.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: waf-harness-engine
  namespace: waf-harness
  labels:
    app.kubernetes.io/name: trishula-engine
    app.kubernetes.io/instance: waf-harness
    app.kubernetes.io/part-of: trishula-waf-harness
spec:
  selector:
    app.kubernetes.io/name: trishula-engine
    app.kubernetes.io/instance: waf-harness
  ports:
    - name: http
      port: 8080
      targetPort: http
